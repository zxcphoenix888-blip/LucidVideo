<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LucidVideo - Pixel Sort FX</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --accent-cyan: #00f5ff;
            --accent-magenta: #ff00ff;
            --accent-purple: #8b5cf6;
            --accent-orange: #ff6b35;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 12s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-80px) translateX(30px); }
            50% { transform: translateY(-40px) translateX(-20px); }
            75% { transform: translateY(-100px) translateX(15px); }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 245, 255, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: -2;
        }

        .header { text-align: center; margin-bottom: 20px; }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .logo-icon {
            animation: logoPulse 2s ease-in-out infinite;
        }
        
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta), var(--accent-purple), var(--accent-cyan));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .tagline {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel {
            background: rgba(18, 18, 26, 0.7);
            border-radius: 18px;
            padding: 0;
            overflow: hidden;
        }

        .panel-inner { padding: 18px; }

        .upload-zone {
            border: none;
            border-radius: 16px;
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .upload-zone:hover { background: rgba(255, 255, 255, 0.06); }
        .upload-zone input { display: none; }
        .upload-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .upload-text { color: var(--text-secondary); font-size: 0.95rem; font-weight: 500; }
        .upload-hint { color: var(--text-muted); font-size: 0.75rem; margin-top: 6px; }

        video { display: none; }

        .canvas-wrapper { display: none; margin: 0; }
        .canvas-wrapper.active { display: block; }
        canvas { width: 100%; display: block; }

        .presets-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

        .preset-btn {
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
            color: var(--text-primary);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(139, 92, 246, 0.2));
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .setting-row select {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .setting-row select option {
            background: #1a1a2e;
            color: var(--text-primary);
            padding: 8px;
        }

        .setting-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-cyan);
        }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .control-group { display: flex; flex-direction: column; gap: 6px; }

        .control-group label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .slider-wrapper { display: flex; align-items: center; gap: 10px; }

        .slider-wrapper input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 3px;
            outline: none;
        }

        .slider-wrapper input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .slider-value {
            min-width: 32px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .buttons-row { display: flex; gap: 10px; margin-top: 18px; }

        .btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
            border: none;
        }

        .btn-play {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: var(--bg-dark);
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.3);
        }

        .btn-play:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 245, 255, 0.5);
        }

        .btn-pause {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-pause:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .btn-record {
            background: linear-gradient(135deg, var(--accent-orange), #ff4444);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-record:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 107, 53, 0.5);
        }

        .btn-record.recording { animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 34, 34, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 34, 34, 0.8); }
        }

        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .status-bar {
            text-align: center;
            padding: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .status-bar.recording { color: #ff4444; animation: blink 1s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .footer { text-align: center; margin-top: 16px; color: var(--text-muted); font-size: 0.7rem; letter-spacing: 1px; }

        @media (min-width: 600px) {
            body { padding: 24px; }
            .main-container { max-width: 500px; }
            .logo { font-size: 2.6rem; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <header class="header">
        <div class="logo-container">
            <svg class="logo-icon" viewBox="0 0 60 60" width="40" height="40">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect x="5" y="5" width="50" height="50" rx="12" fill="url(#logoGrad)" opacity="0.2"/>
                <rect x="8" y="8" width="20" height="44" rx="3" fill="url(#logoGrad)" opacity="0.8"/>
                <rect x="20" y="12" width="15" height="36" rx="3" fill="url(#logoGrad)" opacity="0.6"/>
                <rect x="37" y="10" width="15" height="40" rx="3" fill="url(#logoGrad)"/>
                <rect x="32" y="22" width="23" height="16" rx="2" fill="#0a0a0f"/>
                <rect x="34" y="24" width="19" height="12" rx="1" fill="url(#logoGrad)" opacity="0.9"/>
            </svg>
            <h1 class="logo">LucidVideo</h1>
        </div>
        <p class="tagline">Pixel Sort Visual FX</p>
    </header>

    <div class="main-container">
        <section class="panel">
            <label class="upload-zone">
                <input type="file" id="videoInput" accept="video/mp4,video/webm">
                <span class="upload-icon">✨</span>
                <p class="upload-text">Загрузи видео</p>
                <p class="upload-hint">MP4 или WebM</p>
            </label>
            <video id="video" playsinline loop></video>
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="canvas"></canvas>
            </div>
        </section>

        <section class="panel">
            <div class="panel-inner">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="effects">Effects</button>
                    <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
                </div>
                
                <div class="tab-content active" id="effects-tab">
                    <div class="presets-row">
                        <button class="preset-btn">🌈 Psychedelic</button>
                        <button class="preset-btn">⚡ Glitch</button>
                        <button class="preset-btn">✨ Subtle</button>
                        <button class="preset-btn">🌊 Rainbow</button>
                    </div>

                <div class="controls-grid">
                    <div class="control-group">
                        <label>Intensity</label>
                        <div class="slider-wrapper">
                            <input type="range" id="intensity" min="10" max="150" value="60">
                            <span class="slider-value" id="intensityVal">60</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Threshold</label>
                        <div class="slider-wrapper">
                            <input type="range" id="threshold" min="0" max="255" value="100">
                            <span class="slider-value" id="thresholdVal">100</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Speed</label>
                        <div class="slider-wrapper">
                            <input type="range" id="speed" min="1" max="20" value="8">
                            <span class="slider-value" id="speedVal">8</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Hue Shift</label>
                        <div class="slider-wrapper">
                            <input type="range" id="hue" min="0" max="180" value="80">
                            <span class="slider-value" id="hueVal">80</span>
                        </div>
                    </div>
                    <div class="control-group" style="grid-column: span 2;">
                        <label>Glitch</label>
                        <div class="slider-wrapper">
                            <input type="range" id="glitch" min="0" max="50" value="20">
                            <span class="slider-value" id="glitchVal">20</span>
                        </div>
                    </div>
                </div>

                <div class="buttons-row">
                    <button class="btn btn-play" id="playBtn" disabled>▶ Play</button>
                    <button class="btn btn-pause" id="stopBtn" disabled>⏸ Pause</button>
                    <button class="btn btn-record" id="recordBtn" disabled>⏺ Rec</button>
                    <button class="btn btn-pause" id="fullscreenBtn" disabled>⛶</button>
                </div>
                </div>
                
                <div class="tab-content" id="settings-tab">
                    <div class="settings-group">
                        <div class="setting-row">
                            <span>Quality</span>
                            <select id="qualitySelect">
                                <option value="low">Low (Fast)</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High (Slow)</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <span>Auto Loop</span>
                            <input type="checkbox" id="autoLoop" checked>
                        </div>
                        <div class="setting-row">
                            <span>Show Particles</span>
                            <input type="checkbox" id="showParticles" checked>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="status-bar" id="status">Загрузи видео и запусти</div>
    </div>

    <footer class="footer">Made with ✦ using Pixel Sort</footer>

    <script>
        // Particles
        const particlesContainer = document.getElementById('particles');
        const colors = ['#8b5cf6', '#00f5ff', '#ff00ff', '#ff6b35'];
        for (let i = 0; i < 25; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 12 + 's';
            particle.style.animationDuration = (8 + Math.random() * 8) + 's';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.width = (3 + Math.random() * 4) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        const videoInput = document.getElementById('videoInput');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const ctx = canvas.getContext('2d', { alpha: false });
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recordBtn = document.getElementById('recordBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const intensitySlider = document.getElementById('intensity');
        const thresholdSlider = document.getElementById('threshold');
        const speedSlider = document.getElementById('speed');
        const hueSlider = document.getElementById('hue');
        const glitchSlider = document.getElementById('glitch');
        const intensityVal = document.getElementById('intensityVal');
        const thresholdVal = document.getElementById('thresholdVal');
        const speedVal = document.getElementById('speedVal');
        const hueVal = document.getElementById('hueVal');
        const glitchVal = document.getElementById('glitchVal');
        const statusEl = document.getElementById('status');

        let isPlaying = false, time = 0, mediaRecorder = null, recordedChunks = [], isRecording = false;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let processWidth = isMobile ? 256 : 400;
        
        // Optimization: use larger step for pixel processing
        let pixelStep = isMobile ? 2 : 1;
        
        // Skip frames when processing is too slow
        let frameSkip = 0;
        const maxSkip = isMobile ? 2 : 1;

        intensitySlider.oninput = () => intensityVal.textContent = intensitySlider.value;
        thresholdSlider.oninput = () => thresholdVal.textContent = thresholdSlider.value;
        speedSlider.oninput = () => speedVal.textContent = speedSlider.value;
        hueSlider.oninput = () => hueVal.textContent = hueSlider.value;
        glitchSlider.oninput = () => glitchVal.textContent = glitchSlider.value;

        function applyPreset(name) {
            const p = {
                psychedelic: [70, 80, 12, 140, 30],
                glitch: [50, 140, 10, 40, 45],
                subtle: [30, 160, 4, 20, 5],
                rainbow: [90, 70, 8, 180, 20]
            }[name];
            if (!p) return;
            [intensitySlider, thresholdSlider, speedSlider, hueSlider, glitchSlider].forEach((s, i) => s.value = p[i]);
            [intensityVal, thresholdVal, speedVal, hueVal, glitchVal].forEach((v, i) => v.textContent = p[i]);
        }

        document.querySelectorAll('.preset-btn').forEach((btn, i) => {
            btn.onclick = () => applyPreset(['psychedelic', 'glitch', 'subtle', 'rainbow'][i]);
        });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
            };
        });

        // Settings
        const qualitySelect = document.getElementById('qualitySelect');
        const autoLoopCheck = document.getElementById('autoLoop');
        const particlesCheck = document.getElementById('showParticles');

        qualitySelect.onchange = () => {
            const q = qualitySelect.value;
            if (q === 'low') { processWidth = isMobile ? 180 : 300; pixelStep = isMobile ? 3 : 2; }
            else if (q === 'medium') { processWidth = isMobile ? 256 : 400; pixelStep = isMobile ? 2 : 1; }
            else { processWidth = isMobile ? 400 : 720; pixelStep = 1; }
            if (video.src) {
                canvas.width = processWidth;
                canvas.height = Math.floor(processWidth * video.videoHeight / video.videoWidth);
            }
        };

        autoLoopCheck.onchange = () => { video.loop = autoLoopCheck.checked; };
        
        particlesCheck.onchange = () => {
            document.getElementById('particles').style.display = particlesCheck.checked ? 'block' : 'none';
        };

        videoInput.addEventListener('change', e => {
            if (!e.target.files[0]) return;
            video.src = URL.createObjectURL(e.target.files[0]);
            time = 0;
            video.onloadedmetadata = () => {
                canvas.width = processWidth;
                canvas.height = Math.floor(processWidth * video.videoHeight / video.videoWidth);
                video.play();
                isPlaying = true;
                playBtn.disabled = true; stopBtn.disabled = false; recordBtn.disabled = false; fullscreenBtn.disabled = false;
                canvasWrapper.classList.add('active');
                statusEl.textContent = 'Playing...';
                processFrame();
            };
        });

        function getBrightness(r, g, b) { return 0.299*r + 0.587*g + 0.114*b; }

        function rgbToHsl(r, g, b) {
            r/=255; g/=255; b/=255;
            const max = Math.max(r,g,b), min = Math.min(r,g,b);
            let h, s, l = (max+min)/2;
            if (max !== min) {
                const d = max-min;
                s = l>0.5 ? d/(2-max-min) : d/(max+min);
                if (max===r) h=((g-b)/d+(g<b?6:0))/6;
                else if (max===g) h=((b-r)/d+2)/6;
                else h=((r-g)/d+4)/6;
            }
            return [h*360, s, l];
        }

        function hslToRgb(h, s, l) {
            h/=360;
            if (s===0) return [l*255,l*255,l*255];
            const q = l<0.5 ? l*(1+s) : l+s-l*s;
            const p = 2*l-q;
            const t = x => {
                if(x<0)x+=1; if(x>1)x-=1;
                if(x<1/6)return p+(q-p)*6*x;
                if(x<1/2)return q;
                if(x<2/3)return p+(q-p)*(2/3-x)*6;
                return p;
            };
            return [Math.round(t(h+1/3)*255), Math.round(t(h)*255), Math.round(t(h-1/3)*255)];
        }

        // Optimized: pre-allocate typed arrays
        let pixelData = null;
        let lastProcessTime = 0;
        const targetFPS = isMobile ? 30 : 60;
        const frameInterval = 1000 / targetFPS;

        function processFrame(timestamp) {
            if (!isPlaying) return;

            // Skip frames when processing is too slow
            frameSkip++;
            if (frameSkip > maxSkip) {
                frameSkip = 0;
            } else if (frameSkip > 1) {
                if (!video.paused && !video.ended) requestAnimationFrame(processFrame);
                return;
            }

            // FPS limiting for performance
            const elapsed = timestamp - lastProcessTime;
            if (elapsed < frameInterval) {
                if (!video.paused && !video.ended) requestAnimationFrame(processFrame);
                return;
            }
            lastProcessTime = timestamp;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const intensity = +intensitySlider.value;
            const threshold = +thresholdSlider.value;
            const speed = +speedSlider.value;
            const hueShift = +hueSlider.value;
            const glitchAmount = +glitchSlider.value;
            const w = canvas.width;
            const h = canvas.height;
            
            time += speed * 0.15;

            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            const step = pixelStep;
            const stepInv = 1 / step;

            // Optimized pixel processing - process every Nth pixel
            for (let y = 0; y < h; y += step) {
                const rowPixels = [];
                const rowStart = y * w * 4;
                const offset = Math.sin(time + y * 0.015) * intensity;
                const glitchLine = Math.random() * 100 < glitchAmount * 0.25;

                for (let x = 0; x < w; x += step) {
                    const i = rowStart + x * 4;
                    let r = data[i], g = data[i+1], b = data[i+2];
                    
                    if (glitchLine && Math.random() < glitchAmount * 0.004) {
                        const shift = Math.floor(Math.random() * glitchAmount * 0.5);
                        const src = Math.max(0, Math.min(i + shift * 4, data.length - 4));
                        r = data[src]; g = data[src+1]; b = data[src+2];
                    }
                    
                    if (hueShift > 0) {
                        const [hslH, hslS, hslL] = rgbToHsl(r, g, b);
                        const newH = (hslH + hueShift * Math.sin(time * 0.4 + y * 0.008)) % 360;
                        [r, g, b] = hslToRgb(newH, hslS, hslL);
                    }
                    
                    const brightness = getBrightness(r, g, b);
                    if (brightness > threshold) {
                        rowPixels.push({x, r, g, b, brightness});
                    }
                }

                rowPixels.sort((a, b) => a.brightness - b.brightness);

                for (let j = 0; j < rowPixels.length; j++) {
                    const newX = Math.max(0, Math.min(w - 1, Math.floor(rowPixels[j].x + offset)));
                    const dest = rowStart + newX * 4;
                    data[dest] = rowPixels[j].r;
                    data[dest+1] = rowPixels[j].g;
                    data[dest+2] = rowPixels[j].b;
                }
                
                // Fast fill gaps
                if (step > 1) {
                    for (let x = 0; x < w; x++) {
                        const i = rowStart + x * 4;
                        if (data[i] === 0 && data[i+1] === 0 && data[i+2] === 0) {
                            const srcI = Math.max(0, rowStart + (x - 1) * 4);
                            data[i] = data[srcI];
                            data[i+1] = data[srcI+1];
                            data[i+2] = data[srcI+2];
                        }
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);

            if (video.ended) { video.currentTime = 0; video.play(); time = 0; }
            if (!video.paused) requestAnimationFrame(processFrame);
        }

        playBtn.onclick = () => { if(video.src) { time=0; video.play(); isPlaying=true; playBtn.disabled=true; stopBtn.disabled=false; statusEl.textContent = 'Playing...'; processFrame(0); }};
        stopBtn.onclick = () => { video.pause(); isPlaying=false; playBtn.disabled=false; stopBtn.disabled=true; statusEl.textContent = 'Paused'; };
        recordBtn.onclick = () => isRecording ? stopRecording() : startRecording();

        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                canvasWrapper.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        };

        function startRecording() {
            const stream = canvas.captureStream(60);
            let options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 15000000 };
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                try {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 15000000 });
                } catch (e2) {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                }
            }
            
            recordedChunks = [];
            mediaRecorder.ondataavailable = e => { if(e.data.size) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob(recordedChunks, {type:'video/webm'}));
                a.download = 'lucidvideo.webm'; a.click();
                statusEl.textContent = 'Downloaded!'; statusEl.classList.remove('recording');
            };
            mediaRecorder.start();
            isRecording = true;
            recordBtn.textContent = '⏹ Stop'; recordBtn.classList.add('recording');
            statusEl.textContent = 'Recording...'; statusEl.classList.add('recording');
            video.currentTime = 0; time = 0; video.play(); isPlaying = true; processFrame(0);
        }

        function stopRecording() {
            if (mediaRecorder?.state !== 'inactive') mediaRecorder?.stop();
            video.pause(); isPlaying = false; isRecording = false;
            recordBtn.textContent = '⏺ Rec'; recordBtn.classList.remove('recording');
        }
    </script>
</body>
</html>
